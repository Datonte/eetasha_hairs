<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | eetashacollection</title>
  <link rel="canonical" href="https://eetashacollection.com/shop">
  <meta property="og:site_name" content="eetashacollection">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://eetashacollection.com/shop">
  <meta property="og:title" content="Shop | eetashacollection">
  <meta property="og:description" content="Browse luxury bundles, wigs, frontals, and hair care products. Premium quality, UK delivery.">
  <meta property="og:image" content="https://eetashacollection.com/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1c1c">
  <meta name="description" content="Browse luxury bundles, wigs, frontals, and hair care products. Premium quality, UK delivery.">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.101.1/dist/umd/supabase.min.js"></script>
  <style>
    .shop-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-btn {
      padding: 8px 18px; border-radius: 20px; font-size: 0.75rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
      border: 1.5px solid var(--gray-200); background: white; color: var(--gray-600);
      transition: all var(--transition);
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--gold-dark); color: var(--gold-dark); background: var(--gold-bg);
    }
  </style>
</head>
<body data-page="shop">
  <div id="siteNav"></div>

  <section class="section page-top">
    <div class="container">
      <div class="section-header">
        <div>
          <span class="section-subtitle">Curated Excellence</span>
          <h1 class="serif">The Collection</h1>
          <p class="delivery-note" id="shopDeliveryNote" style="margin-top:6px;"></p>
        </div>
      </div>

      <div class="shop-filters" id="shopFilters"></div>
      <div class="grid-3" id="shopGrid">
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray-400);">Loading...</div>
      </div>
      <div id="shopEmpty" class="hidden text-center" style="padding:60px 20px; color: var(--gray-400);">
        <span class="material-symbols-outlined" style="font-size:48px; opacity:0.3; margin-bottom:12px;">inventory_2</span>
        <p>No products in this category yet.</p>
      </div>
      <div id="socialCta" style="margin-top:48px;"></div>
    </div>
  </section>

  <div id="siteFooter"></div>
  <script src="js/app.js"></script>
  <script>
    // Filters: All (shown in sections, one per category), each category, plus "Ready to ship" and "On sale"
    const READY = 'Ready to ship', SALE = 'On sale';
    const SPECIAL = {
      [READY]: p => p.in_stock && dispatchInfo(p)?.mode === 'ready',
      [SALE]:  p => salePercent(p) > 0,
    };
    let activeFilter = new URLSearchParams(location.search).get('cat') || 'All';

    const attr = s => escHtml(s).replace(/"/g, '&quot;');
    const categories = () => [...new Set(Store.getProducts().map(p => p.category).filter(Boolean))];

    function renderShop() {
      const products = Store.getProducts();
      const grid     = document.getElementById('shopGrid');
      const empty    = document.getElementById('shopEmpty');

      if (activeFilter === 'All' && categories().length > 1) {
        // One section per category, like a collection page
        grid.className = '';
        grid.innerHTML = categories().map(c => {
          const list = products.filter(p => p.category === c);
          return `<section class="shop-section">
            <div class="shop-section-head"><h2 class="serif">${escHtml(c)}</h2>
              <button data-cat="${attr(c)}" onclick="setFilter(this.dataset.cat, true)">See all ${list.length}</button></div>
            <div class="grid-3">${list.map(productCardHTML).join('')}</div>
          </section>`;
        }).join('');
        empty.classList.add('hidden');
        return;
      }

      const filtered = activeFilter === 'All' ? products
        : SPECIAL[activeFilter] ? products.filter(SPECIAL[activeFilter])
        : products.filter(p => p.category === activeFilter);
      grid.className = 'grid-3';
      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = filtered.map(productCardHTML).join('');
      }
    }

    function renderFilters() {
      const products = Store.getProducts();
      const extras = Object.keys(SPECIAL).filter(k => products.some(SPECIAL[k]));
      document.getElementById('shopFilters').innerHTML = ['All', ...categories(), ...extras].map(c =>
        `<button class="filter-btn ${c === activeFilter ? 'active' : ''}" data-cat="${attr(c)}" onclick="setFilter(this.dataset.cat)">${escHtml(c)}</button>`
      ).join('');
    }

    function setFilter(cat, scroll) {
      activeFilter = cat;
      // Keep the choice in the address, so a link like /shop?cat=Wigs opens that section
      const url = new URL(location.href);
      if (cat === 'All') url.searchParams.delete('cat'); else url.searchParams.set('cat', cat);
      history.replaceState(null, '', url);
      renderFilters();
      renderShop();
      if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initApp();
      renderNav('shop');
      renderFooter();
      document.getElementById('shopDeliveryNote').textContent = deliveryNoteText();
      updateCartCount();
      renderFilters();
      renderShop();
      document.getElementById('socialCta').innerHTML = socialCtaHTML();
      document.body.classList.add('page-ready');
    });
  </script>
</body>
</html>
