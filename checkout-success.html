<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | eetashacollection</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1c1c">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.101.1/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="siteNav"></div>
  <div class="auth-page">
    <div class="auth-card text-center">
      <!-- Starts neutral; only says "payment successful" once Stripe confirms it -->
      <span class="material-symbols-outlined" id="statusIcon" style="font-size:56px;color:var(--gray-400);margin-bottom:12px;">hourglass_top</span>
      <h1 style="font-size:1.6rem;" class="serif mb-1" id="statusTitle">Checking your payment…</h1>
      <p style="color:var(--gray-500);font-size:0.9rem;margin-bottom:20px;" id="statusMsg">This only takes a moment.</p>
      <p style="font-family:var(--font-head);color:var(--gold-dark);font-size:1.1rem;margin-bottom:24px;" id="orderId"></p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="/account" class="btn btn-primary btn-sm hidden" id="viewOrdersBtn">View My Orders</a>
        <a href="/shop" class="btn btn-secondary btn-sm">Continue Shopping</a>
      </div>
    </div>
  </div>
  <div id="siteFooter"></div>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await initApp();
      renderNav('');
      renderFooter();


      const params    = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      const orderId   = params.get('order_id');
      const show = (icon, colour, title, msg, order) => {
        const i = document.getElementById('statusIcon');
        i.textContent = icon; i.style.color = colour;
        document.getElementById('statusTitle').textContent = title;
        document.getElementById('statusMsg').textContent   = msg;
        document.getElementById('orderId').textContent     = order ? `Order: ${order}` : '';
      };
      // Logged-in customers can see their orders; guests get everything by email
      if (Store.getSession()) document.getElementById('viewOrdersBtn').classList.remove('hidden');

      if (sessionId) {
        // Ask the server (which asks Stripe) whether this payment really went through
        try {
          const result = await API.get(`/api/verify-payment/${encodeURIComponent(sessionId)}`);
          if (result.paid) {
            // Payment confirmed — now it's safe to empty the bag
            Store.clearCart();
            try { sessionStorage.removeItem('et_delivery'); sessionStorage.removeItem('checkoutFormState'); } catch {}
            show('check_circle', 'var(--success)', 'Thank you for your order!',
              `Your payment was successful and your receipt has been emailed to ${result.receiptTo || 'you'}. We'll email you again when your order is on its way.`,
              result.orderNumber || orderId);
          } else {
            show('pending', 'var(--warning)', 'Payment pending',
              "Your payment is still being processed. Your receipt will be emailed to you as soon as it's confirmed.",
              result.orderNumber || orderId);
          }
        } catch {
          show('mail', 'var(--gold-dark)', 'Thank you',
            "We couldn't check your payment just now. If it went through, your receipt is on its way to your email.", orderId);
        }
      } else {
        // Opened without a payment (typed in or an old link): don't claim anything was paid
        show('receipt_long', 'var(--gold-dark)', 'Looking for your receipt?',
          "Receipts are emailed as soon as a payment goes through. Check your inbox (and spam folder), or email us and we'll help.", '');
      }
      document.body.classList.add('page-ready');
    });
  </script>
</body>
</html>
